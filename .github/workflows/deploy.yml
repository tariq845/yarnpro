
name: Deploy to SmarterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smarterasp-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore YIS/YIS.csproj

      - name: Build Project
        run: dotnet build YIS/YIS.csproj \
          --configuration Release --no-restore

      - name: Publish Web Application
        run: dotnet publish YIS/YIS.csproj \
          --configuration Release \
          --no-build \
          --output ./publish \
          -p:UseAppHost=false

      - name: Verify Publish Output
        run: |
          test -f ./publish/YIS.dll || {
            echo "ERROR: YIS.dll was not found in publish output."
            exit 1
          }
          echo "Publish output verified."

      - name: Deploy to SmarterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTERASP_FTP_SERVER }}
          username: ${{ secrets.SMARTERASP_FTP_USERNAME }}
          password: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./publish/
          server-dir: ${{ secrets.SMARTERASP_FTP_REMOTE_PATH || 'ys/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/app_offline.htm

      - name: Deployment Summary
        if: success()
        run: echo "FTP deployment completed successfully."
